<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سكن · معاينة الجوال</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF0F3;--fg:#0C0C0E;--mut:#55585F;--frame:#111214;--chip:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0C0C0E;--fg:#F2F3F5;--mut:#A3A8B3;--frame:#2A2C31;--chip:#1A1B20;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;padding:24px 16px 40px}
header{max-width:1000px;margin:0 auto 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:28px}
p{margin:4px 0 0;color:var(--mut)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{background:var(--chip);color:var(--fg);text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.row{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
figcaption{font-weight:600}
figcaption span{display:block;font-weight:400;font-size:13px;color:var(--mut);text-align:center}
.phone{position:relative;background:var(--frame);padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.25)}
.ios{width:417px;height:876px;border-radius:58px}
.android{width:432px;height:935px;border-radius:40px;padding:10px}
.phone iframe{display:block;width:100%;height:100%;border:0;background:#000}
.ios iframe{border-radius:46px}
.android iframe{border-radius:30px}
.island{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.punch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#000;z-index:2;pointer-events:none}
.scale{transform-origin:top center}
@media (max-width:980px){.scale{transform:scale(.8);margin-bottom:-180px}}
@media (max-width:480px){.scale{transform:scale(.72);margin-bottom:-250px}}
</style>
</head>
<body>
<header>
  <div><h1>معاينة سكن على الجوال</h1><p>التطبيق الحقيقي يعمل داخل كل جهاز. اضغط وتنقّل كما تفعل على جوالك.</p></div>
  <nav class="links" aria-label="روابط"><a href="./">فتح التطبيق</a><a href="#" id="reload">إعادة التحميل</a></nav>
</header>
<div class="row">
  <figure><div class="scale"><div class="phone ios"><span class="island" aria-hidden="true"></span><iframe src="./?v=ios#overview" title="سكن على آيفون"></iframe></div></div><figcaption>آيفون · المالك<span>393 × 852</span></figcaption></figure>
  <figure><div class="scale"><div class="phone android"><span class="punch" aria-hidden="true"></span><iframe src="./?v=android#t-home" title="بوابة المستأجر على أندرويد"></iframe></div></div><figcaption>أندرويد · المستأجر<span>412 × 915</span></figcaption></figure>
</div>
<script>
document.getElementById('reload').addEventListener('click', function (e) { e.preventDefault(); document.querySelectorAll('iframe').forEach(function (f) { f.src = f.src; }); });
</script>
</body>
</html>
