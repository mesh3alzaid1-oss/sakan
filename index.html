<!doctype html>
<html lang="ar" dir="rtl" data-style="vivid" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سكن · لوحة المالك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700&family=Inter:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var s = localStorage.getItem('sakan-style'), t = localStorage.getItem('sakan-theme');
    if (s) document.documentElement.dataset.style = s;
    if (t) document.documentElement.dataset.mode = t;
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <nav class="side glass" aria-label="القائمة">
    <span class="brand">سكن</span>
    <div class="links">
      <a href="#overview" data-page="overview">نظرة عامة</a>
      <a href="#buildings" data-page="buildings">المباني</a>
      <a href="#rent" data-page="rent">الإيجار</a>
      <a href="#maintenance" data-page="maintenance">الصيانة</a>
      <a href="#prefs" data-page="prefs">الإعدادات</a>
    </div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="المظهر">
      <button type="button" data-set-theme="light">فاتح</button>
      <button type="button" data-set-theme="dark">داكن</button>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
